{"name":"Build Jarvis APK","on":["push","workflow_dispatch"],"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"name":"Unzip project","run":"mkdir -p proj && unzip -q Jarvis.zip -d proj && echo \"P=$(dirname \"$(find proj -name settings.gradle.kts | head -1)\")\" >> \"$GITHUB_ENV\""},{"name":"Build","shell":"bash","run":"cd \"$P\" && gradle assembleDebug --no-daemon 2>&1 | tee \"$GITHUB_WORKSPACE/build.log\""},{"name":"Save error log","if":"failure()","run":"cd \"$GITHUB_WORKSPACE\"\n{ echo \"=== ERRORS ===\"; grep -n -E \"^e: |error:|FAILED|What went wrong|Could not|Duplicate|not found|Execution failed\" -A4 build.log | head -150; echo; echo \"=== LAST 60 LINES ===\"; tail -n 60 build.log; } > build-error.txt\ngit config user.name \"github-actions\"\ngit config user.email \"actions@github.com\"\ngit add build-error.txt\ngit commit -m \"build log [skip ci]\" || true\ngit push origin HEAD:main || true"},{"name":"Rename APK","run":"cp \"$P\"/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk"},{"uses":"softprops/action-gh-release@v2","with":{"tag_name":"jarvis-${{ github.run_number }}","name":"Jarvis build ${{ github.run_number }}","files":"Jarvis.apk"}}]}}}